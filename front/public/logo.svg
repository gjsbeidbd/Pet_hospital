<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- 房子渐变色 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a1c4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2e9fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 房子主体 -->
  <g transform="translate(60, 55)">
    <!-- 屋顶 (三角形) -->
    <path d="M -35,10 L 0,-25 L 35,10 Z" fill="url(#roofGrad)" opacity="0.95"/>
    
    <!-- 房子墙体 -->
    <rect x="-32" y="10" width="64" height="45" rx="3" fill="url(#wallGrad)" opacity="0.95"/>
    
    <!-- 大门 (拱形) -->
    <path d="M -12,25 L -12,50 A 12,12 0 0,1 12,50 L 12,25 Z" fill="#667eea" opacity="0.9"/>
    <!-- 门上的小窗户 -->
    <circle cx="0" cy="35" r="6" fill="#ffecd2" opacity="0.8"/>
    
    <!-- 左边窗户 -->
    <rect x="-26" y="22" width="14" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
    <line x1="-19" y1="22" x2="-19" y2="36" stroke="#667eea" stroke-width="2" opacity="0.6"/>
    <line x1="-26" y1="29" x2="-12" y2="29" stroke="#667eea" stroke-width="2" opacity="0.6"/>
    
    <!-- 右边窗户 -->
    <rect x="18" y="22" width="14" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
    <line x1="25" y1="22" x2="25" y2="36" stroke="#667eea" stroke-width="2" opacity="0.6"/>
    <line x1="18" y1="29" x2="32" y2="29" stroke="#667eea" stroke-width="2" opacity="0.6"/>
    
    <!-- 烟囱 -->
    <rect x="18" y="-30" width="10" height="18" rx="2" fill="#ffecd2" opacity="0.9"/>
    <!-- 烟囱冒出的烟 -->
    <circle cx="23" cy="-38" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="26" cy="-44" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="20" cy="-42" r="3" fill="#ffffff" opacity="0.5"/>
    
    <!-- 屋檐下的装饰灯串 -->
    <circle cx="-28" cy="8" r="3" fill="#ff6b6b" opacity="0.8"/>
    <circle cx="-18" cy="10" r="3" fill="#ffd93d" opacity="0.8"/>
    <circle cx="-8" cy="8" r="3" fill="#6bcb77" opacity="0.8"/>
    <circle cx="2" cy="10" r="3" fill="#4d96ff" opacity="0.8"/>
    <circle cx="12" cy="8" r="3" fill="#ff6b6b" opacity="0.8"/>
    <circle cx="22" cy="10" r="3" fill="#ffd93d" opacity="0.8"/>
    <circle cx="32" cy="8" r="3" fill="#6bcb77" opacity="0.8"/>
    
    <!-- 宠物爪印 (墙上左侧) -->
    <g transform="translate(-22, 42)">
      <ellipse cx="0" cy="0" rx="5" ry="4" fill="#ffffff" opacity="0.7"/>
      <circle cx="-6" cy="-5" r="2.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="0" cy="-6" r="2.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="6" cy="-5" r="2.5" fill="#ffffff" opacity="0.7"/>
    </g>
    
    <!-- 宠物爪印 (墙上右侧) -->
    <g transform="translate(22, 42)">
      <ellipse cx="0" cy="0" rx="5" ry="4" fill="#ffffff" opacity="0.7"/>
      <circle cx="-6" cy="-5" r="2.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="0" cy="-6" r="2.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="6" cy="-5" r="2.5" fill="#ffffff" opacity="0.7"/>
    </g>
    
    <!-- 小猫图案 (屋顶左侧) -->
    <g transform="translate(-20, -10)">
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#ffffff" opacity="0.9"/>
      <polygon points="-6,-4 -8,-10 -3,-7" fill="#ffffff" opacity="0.9"/>
      <polygon points="6,-4 8,-10 3,-7" fill="#ffffff" opacity="0.9"/>
      <circle cx="-3" cy="-1" r="2" fill="#333" opacity="0.8"/>
      <circle cx="3" cy="-1" r="2" fill="#333" opacity="0.8"/>
    </g>
    
    <!-- 小狗骨头 (屋顶右侧) -->
    <g transform="translate(20, -8)" opacity="0.9" fill="#ffffff">
      <circle cx="-5" cy="-3" r="3"/>
      <circle cx="5" cy="3" r="3"/>
      <circle cx="-5" cy="3" r="3"/>
      <circle cx="5" cy="-3" r="3"/>
      <rect x="-5" y="-3" width="10" height="6" rx="2"/>
    </g>
  </g>
  
  <!-- 底部草地 -->
  <ellipse cx="60" cy="105" rx="50" ry="12" fill="#a8e6cf" opacity="0.6"/>
  
  <!-- 两侧的小花 -->
  <g transform="translate(25, 98)">
    <circle cx="0" cy="0" r="4" fill="#ff9a9e" opacity="0.8"/>
    <circle cx="4" cy="0" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="-4" cy="0" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="0" cy="4" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="0" cy="-4" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#ffd93d" opacity="0.9"/>
  </g>
  
  <g transform="translate(95, 98)">
    <circle cx="0" cy="0" r="4" fill="#ff9a9e" opacity="0.8"/>
    <circle cx="4" cy="0" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="-4" cy="0" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="0" cy="4" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="0" cy="-4" r="4" fill="#ffecd2" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#ffd93d" opacity="0.9"/>
  </g>
</svg>
